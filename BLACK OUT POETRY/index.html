<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blackout Poetry Generator</title>

  <style>

    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
      background: #f5f5f5;
      color: #111;
    }

    h1 {
      margin-bottom: 10px;
    }

    .intro {
      background: white;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 25px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
      line-height: 1.7;
    }

    textarea {
      width: 100%;
      height: 220px;
      padding: 12px;
      font-size: 16px;
      margin-bottom: 15px;
      resize: vertical;
      box-sizing: border-box;
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }

    button,
    select {
      padding: 10px 14px;
      font-size: 16px;
    }

    button {
      cursor: pointer;
    }

    #output {
      background: white;
      padding: 25px;
      border-radius: 10px;
      line-height: 2;
      font-size: 24px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.1);
      word-wrap: break-word;
      min-height: 150px;
    }

    .hidden {
      background: black;
      color: black;
      padding: 2px 4px;
      border-radius: 2px;
      user-select: none;
    }

    .visible {
      color: black;
    }

  </style>
</head>

<body>

  <h1>Blackout Poetry Generator</h1>

  <div class="intro">
    Blackout poetry is created by hiding most words in a text while
    leaving only selected fragments visible. Paste text below, choose a
    mode, and generate accidental poetry from the remaining words.
  </div>

  <textarea
    id="inputText"
    placeholder="Paste text here..."></textarea>

  <div class="controls">

    <select id="mode">
      <option value="0.05">Sparse Mode (5%)</option>
      <option value="0.15">Poetry Mode (15%)</option>
      <option value="0.50">Chaos Mode (50%)</option>
    </select>

    <button onclick="generateBlackout()">
      Generate
    </button>

  </div>

  <div id="output"></div>

  <script>

    function generateBlackout() {

      const text =
        document.getElementById("inputText").value;

      const revealRate =
        parseFloat(document.getElementById("mode").value);

      if (text.trim() === "") {
        document.getElementById("output").innerHTML =
          "Please enter some text.";
        return;
      }

      const words = text.split(/(\s+)/);

      let result = "";

      words.forEach(word => {

        // Preserve spaces and line breaks
        if (word.trim() === "") {
          result += word;
          return;
        }

        const showWord =
          Math.random() < revealRate;

        if (showWord) {

          result +=
            `<span class="visible">${word}</span>`;

        } else {

          result +=
            `<span class="hidden">${word}</span>`;

        }

      });

      document.getElementById("output").innerHTML =
        result;
    }

  </script>

</body>
</html>
